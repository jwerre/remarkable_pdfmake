name: Deploy Remarkable PDFMake plugin

on: [push]

jobs:
    deploy:
        runs-on: ubuntu-latest

        permissions:
            id-token: write # Required for npm Trusted Publishers
            contents: write # Required to create GitHub releases and push tags

        concurrency:
            group: ${{ github.ref }}
            cancel-in-progress: true

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'

            - name: Install packages
              run: npm ci --ignore-scripts

            - name: Security audit
              run: npm audit --audit-level=moderate --omit=dev

            - name: Format check
              run: npm run format

            - name: Lint check
              run: npm run lint

            - name: Spell check
              run: npm run spell

            - name: Test
              run: npm run test:ci

            - name: Release
              run: npm run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
